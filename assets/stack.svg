      <rect x="0" y="0" width="125" height="44" rx="6" fill="#061226" stroke="#1e293b"/>
      <text x="14" y="22" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800">React</text>
      <text x="14" y="35" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">INTERACTIVE SPA</text>

      <!-- Next.js -->
