      <rect x="315" y="0" width="85" height="42" rx="6" fill="#061226" stroke="#1e293b"/>
      <rect x="323" y="11" width="20" height="20" rx="3" fill="#00add8"/>
      <text x="333" y="25" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="900">GO</text>
      <text x="349" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">Golang</text>
      <text x="349" y="31" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5">FAST CRAWLER</text>
