      <text x="14" y="22" transform="translate(270,0)" fill="#ff0055" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800">MCP &amp; LLM APIs</text>
