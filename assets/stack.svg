  </g>

  <!-- 02 / FRONTEND -->
  <g transform="translate(0, 80)">
    <text x="0" y="10" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">02 / FRONTEND</text>
    <g transform="translate(0, 18)">
