<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" fill="none">
<defs>
  <linearGradient id="st-bg" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#050813"/>
    <stop offset="100%" stop-color="#090f1f"/>
  </linearGradient>
  <linearGradient id="st-border" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
    <stop offset="50%" stop-color="#ff354f" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#247bff" stop-opacity="0.4"/>
  </linearGradient>
  <pattern id="st-dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.08"/>
  </pattern>
</defs>

<style>
  @keyframes orb-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes orb-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
  .orbit-track { animation: orb-pulse 4s ease-in-out infinite; }
</style>

<rect width="860" height="420" rx="16" fill="url(#st-bg)"/>
<rect width="860" height="420" rx="16" fill="url(#st-dots)"/>
<rect x="0.5" y="0.5" width="859" height="419" rx="15.5" stroke="url(#st-border)" stroke-width="1"/>

<!-- Header matching Reel: "03 / MY ENGINE ROOM" / "TOOLS CHANGE. CURIOSITY DOESN'T." -->
<g transform="translate(45, 36)">
  <text x="0" y="0" fill="#247bff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">03 / MY ENGINE ROOM</text>
  <text x="0" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">TOOLS CHANGE. CURIOSITY DOESN'T.</text>
  <text x="0" y="46" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">LANGUAGES / SYSTEMS / INTELLIGENCE</text>
</g>

<!-- SPLIT LAYOUT -->
<!-- LEFT: Planetary Atom Orbits with Central [ MB ] Hexagon Nucleus -->
<g transform="translate(225, 245)">
  <!-- Glow Core -->
  <circle cx="0" cy="0" r="110" fill="#247bff" opacity="0.08" filter="blur(30px)"/>

  <!-- Orbits matching Reel -->
  <ellipse class="orbit-track" cx="0" cy="0" rx="160" ry="70" fill="none" stroke="#247bff" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(-25)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="150" ry="60" fill="none" stroke="#ff354f" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(25)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="120" ry="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" transform="rotate(-65)"/>

  <!-- Central Glowing Cube/Hexagon with Initials "MB" (Mayukh Bhattacharjee) -->
  <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#0d172e" stroke="#247bff" stroke-width="2"/>
  <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#132347"/>
  <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1">MB</text>

  <!-- Orbit Nodes with tech badges matching Reel -->
  <!-- Python -->
  <g transform="translate(-130, -35)">
    <circle cx="0" cy="0" r="14" fill="#0b1324" stroke="#3776AB" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">Py</text>
  </g>
  <!-- Go -->
  <g transform="translate(125, 30)">
    <circle cx="0" cy="0" r="14" fill="#0b1324" stroke="#00ADD8" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#00ADD8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">Go</text>
  </g>
  <!-- React -->
  <g transform="translate(-60, 65)">
    <circle cx="0" cy="0" r="14" fill="#0b1324" stroke="#61DAFB" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#61DAFB" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">Re</text>
  </g>
  <!-- Node -->
  <g transform="translate(70, -60)">
    <circle cx="0" cy="0" r="14" fill="#0b1324" stroke="#339933" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">No</text>
  </g>
  <!-- TS -->
  <g transform="translate(-115, 45)">
    <circle cx="0" cy="0" r="13" fill="#0b1324" stroke="#3178C6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">TS</text>
  </g>
  <!-- Next.js -->
  <g transform="translate(110, -45)">
    <circle cx="0" cy="0" r="13" fill="#0b1324" stroke="#ffffff" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">Nx</text>
  </g>

  <!-- Left Footer Text matching Reel -->
  <text x="0" y="145" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">CODE IS THE TOOL. IMPACT IS THE POINT.</text>
</g>

<!-- RIGHT: Structured Grid of Tech Chips matching Reel -->
<g transform="translate(450, 110)">
  <!-- 01 / LANGUAGES -->
  <text x="0" y="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">01 / LANGUAGES</text>
  <g transform="translate(0, 22)">
    <!-- Python -->
    <rect x="0" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="12" y="21" font-size="13">🐍</text>
    <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Python</text>

    <!-- Go -->
    <rect x="125" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="137" y="21" font-size="13">🐹</text>
    <text x="161" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Go (Golang)</text>

    <!-- TypeScript -->
    <rect x="250" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="262" y="21" font-size="13">📘</text>
    <text x="284" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">TypeScript</text>
  </g>

  <!-- 02 / FRONTEND & RUNTIME -->
  <text x="0" y="82" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">02 / FRONTEND &amp; RUNTIME</text>
  <g transform="translate(0, 92)">
    <!-- React -->
    <rect x="0" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="12" y="21" font-size="13">⚛️</text>
    <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">React 18</text>

    <!-- Next.js -->
    <rect x="125" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="137" y="21" font-size="13">▲</text>
    <text x="161" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Next.js</text>

    <!-- SvelteKit -->
    <rect x="250" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="262" y="21" font-size="13">🔥</text>
    <text x="284" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">SvelteKit</text>
  </g>

  <!-- 03 / BACKEND, CLOUD & AI -->
  <text x="0" y="152" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">03 / BACKEND, CLOUD &amp; AI</text>
  <g transform="translate(0, 162)">
    <!-- Node / Gin -->
    <rect x="0" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="12" y="21" font-size="13">🟢</text>
    <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Node / Gin</text>

    <!-- OpenCV -->
    <rect x="125" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="137" y="21" font-size="13">👁️</text>
    <text x="161" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">OpenCV</text>

    <!-- Supabase / Vercel -->
    <rect x="250" y="0" width="115" height="34" rx="6" fill="#0d1424" stroke="#1e293b"/>
    <text x="262" y="21" font-size="13">⚡</text>
    <text x="284" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Supabase</text>
  </g>

  <!-- Right Footer matching Reel -->
  <text x="0" y="235" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">BUILD / MENTOR / CREATE / REPEAT</text>
</g>
</svg>