<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="420" viewBox="0 0 860 420" fill="none">
<defs>
  <linearGradient id="st-bg" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#02040a"/>
    <stop offset="50%" stop-color="#060d1f"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>
  <linearGradient id="st-border" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#ff0055" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
  </linearGradient>
  <radialGradient id="st-glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28"/>
    <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="st-glow-crimson" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff0055" stop-opacity="0.22"/>
    <stop offset="60%" stop-color="#ff0055" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="st-glow-blue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#247bff" stop-opacity="0.25"/>
    <stop offset="60%" stop-color="#247bff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="st-dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#00f0ff" fill-opacity="0.11"/>
  </pattern>
</defs>

<style>
  @keyframes orb-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
  @keyframes spin-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes float-cube { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .orbit-track { animation: orb-pulse 4s ease-in-out infinite; }
  .floating-core { animation: float-cube 3s ease-in-out infinite; }
</style>

<rect width="860" height="420" rx="16" fill="url(#st-bg)"/>
<rect width="860" height="420" rx="16" fill="url(#st-dots)"/>
<circle cx="215" cy="245" r="170" fill="url(#st-glow-cyan)"/>
<circle cx="620" cy="230" r="170" fill="url(#st-glow-crimson)"/>
<rect x="0.5" y="0.5" width="859" height="419" rx="15.5" stroke="url(#st-border)" stroke-width="1.2"/>

<!-- Header -->
<g transform="translate(45, 36)">
  <text x="0" y="0" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">03 / MY ENGINE ROOM</text>
  <text x="0" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">TOOLS CHANGE. CURIOSITY DOESN'T.</text>
  <text x="0" y="46" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">LANGUAGES / SYSTEMS / INTELLIGENCE</text>
</g>

<!-- LEFT: Cyberpunk Constellation / Orbital Tree (Center at x=215, y=242) -->
<g transform="translate(215, 242)">
  <!-- Tree Branch Beams connecting Core to Outer Tech Nodes -->
  <line x1="0" y1="-20" x2="0" y2="-92" stroke="#ff9900" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="-18" y1="-10" x2="-80" y2="-55" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="-24" y1="0" x2="-132" y2="-10" stroke="#3178c6" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="-18" y1="14" x2="-85" y2="60" stroke="#61dafb" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="18" y1="-10" x2="75" y2="-50" stroke="#00add8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="24" y1="4" x2="130" y2="15" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="16" y1="18" x2="60" y2="70" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3"/>

  <!-- Orbital Rings -->
  <ellipse class="orbit-track" cx="0" cy="0" rx="146" ry="62" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45" transform="rotate(-24)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="136" ry="52" fill="none" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(26)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="114" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" transform="rotate(-64)"/>

  <!-- Satellite Particles on Tracks -->
  <circle cx="-110" cy="38" r="3" fill="#00f0ff"/>
  <circle cx="100" cy="-34" r="2.5" fill="#ff0055"/>
  <circle cx="-42" cy="-78" r="2" fill="#38bdf8"/>
  <circle cx="120" cy="40" r="2.5" fill="#f59e0b"/>

  <!-- Center: 3D Isometric Neon Core Cube with "MB" -->
  <g class="floating-core">
    <!-- Top Face -->
    <polygon points="0,-28 24,-14 0,0 -24,-14" fill="#0c234a" stroke="#00f0ff" stroke-width="1.4"/>
    <!-- Left Face -->
    <polygon points="-24,-14 0,0 0,26 -24,12" fill="#061226" stroke="#00f0ff" stroke-width="1.4"/>
    <!-- Right Face -->
    <polygon points="0,0 24,-14 24,12 0,26" fill="#091b38" stroke="#00f0ff" stroke-width="1.4"/>
    <!-- Center Monogram -->
    <text x="0" y="15" text-anchor="middle" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" letter-spacing="1">MB</text>
  </g>

  <!-- Node 1: AWS / Cloud (Top) -->
  <g transform="translate(0, -92)">
    <rect x="-20" y="-12" width="40" height="24" rx="5" fill="#0a162c" stroke="#ff9900" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#ff9900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">AWS</text>
  </g>

  <!-- Node 2: Python (Top-Left) -->
  <g transform="translate(-80, -55)">
    <circle cx="0" cy="0" r="15" fill="#050e1f" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">Py</text>
  </g>

  <!-- Node 3: TypeScript (Far-Left) -->
  <g transform="translate(-132, -10)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#07132a" stroke="#3178c6" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="900">TS</text>
  </g>

  <!-- Node 4: React (Bottom-Left) -->
  <g transform="translate(-85, 60)">
    <circle cx="0" cy="0" r="15" fill="#050e1f" stroke="#61dafb" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#61dafb" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800">⚛</text>
  </g>

  <!-- Node 5: Golang (Top-Right) -->
  <g transform="translate(75, -50)">
    <circle cx="0" cy="0" r="15" fill="#050e1f" stroke="#00add8" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#00add8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">Go</text>
  </g>

  <!-- Node 6: AI / Agent Engine (Far-Right) -->
  <g transform="translate(130, 15)">
    <circle cx="0" cy="0" r="15" fill="#1a0a16" stroke="#ff0055" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#ff0055" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="900">AI</text>
  </g>

  <!-- Node 7: Node.js (Bottom-Right) -->
  <g transform="translate(60, 70)">
    <circle cx="0" cy="0" r="15" fill="#051410" stroke="#22c55e" stroke-width="1.3"/>
    <text x="0" y="4" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">No</text>
  </g>

  <!-- Bottom Tree Caption -->
  <text x="0" y="145" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">CODE IS THE TOOL. IMPACT IS THE POINT.</text>
</g>

<!-- RIGHT: Categorized Tech Grid matching Reel Photo 1 (Starts at x=445) -->
<g transform="translate(445, 105)">
  <!-- 01 / LANGUAGES -->
  <text x="0" y="12" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">01 / LANGUAGES</text>
  <g transform="translate(0, 20)">
    <!-- TypeScript -->
    <rect x="0" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <rect x="10" y="9" width="16" height="16" rx="3" fill="#0c1e3d"/>
    <text x="18" y="21" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800">TS</text>
    <text x="32" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">TypeScript</text>
    <text x="12" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">TYPED RUNTIME</text>

    <!-- Python -->
    <rect x="124" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="134" y="22" font-size="12">🐍</text>
    <text x="154" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Python</text>
    <text x="134" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">AI &amp; AUTOMATION</text>

    <!-- Golang -->
    <rect x="248" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="258" y="22" font-size="12">🐹</text>
    <text x="278" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Golang</text>
    <text x="258" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">CONCURRENT GO</text>
  </g>

  <!-- 02 / FRONTEND & RUNTIME -->
  <text x="0" y="88" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">02 / FRONTEND &amp; RUNTIME</text>
  <g transform="translate(0, 96)">
    <!-- React 18 -->
    <rect x="0" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="12" y="22" font-size="12">⚛️</text>
    <text x="32" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">React 18</text>
    <text x="12" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">INTERACTIVE UI</text>

    <!-- Next.js -->
    <rect x="124" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="134" y="22" font-size="12">▲</text>
    <text x="154" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Next.js</text>
    <text x="134" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">SSR PLATFORMS</text>

    <!-- Node.js -->
    <rect x="248" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="258" y="22" font-size="12">🟢</text>
    <text x="278" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Node.js</text>
    <text x="258" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">V8 RUNTIME</text>
  </g>

  <!-- 03 / BACKEND, CLOUD & AI -->
  <text x="0" y="164" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">03 / BACKEND, CLOUD &amp; AI</text>
  <g transform="translate(0, 172)">
    <!-- Express -->
    <rect x="0" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="12" y="22" font-size="12">⚡</text>
    <text x="32" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Express</text>
    <text x="12" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">REST &amp; SSE APIS</text>

    <!-- AWS / Cloud -->
    <rect x="124" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="134" y="22" font-size="12">☁️</text>
    <text x="154" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">AWS Cloud</text>
    <text x="134" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">INFRA &amp; DEPLOY</text>

    <!-- LLM APIs / Agents -->
    <rect x="248" y="0" width="114" height="46" rx="7" fill="#050a16" stroke="#1e293b"/>
    <text x="258" y="22" font-size="12">🧠</text>
    <text x="278" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">LLM APIs</text>
    <text x="258" y="37" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">INTELLIGENT AGENTS</text>
  </g>

  <text x="0" y="244" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">BUILD / MENTOR / CREATE / REPEAT</text>
</g>
</svg>