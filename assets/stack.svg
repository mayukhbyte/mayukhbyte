<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" fill="none">
<defs>
  <linearGradient id="st-bg" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#02040a"/>
    <stop offset="50%" stop-color="#060d1f"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>
  <linearGradient id="st-border" x1="0" y1="0" x2="860" y2="420" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#ff0055" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
  </linearGradient>
  <radialGradient id="st-glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
    <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="st-glow-crimson" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff0055" stop-opacity="0.22"/>
    <stop offset="60%" stop-color="#ff0055" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
  </radialGradient>
  <pattern id="st-dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#00f0ff" fill-opacity="0.11"/>
  </pattern>
</defs>

<style>
  @keyframes orb-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
  .orbit-track { animation: orb-pulse 4s ease-in-out infinite; }
</style>

<rect width="860" height="420" rx="16" fill="url(#st-bg)"/>
<rect width="860" height="420" rx="16" fill="url(#st-dots)"/>
<circle cx="215" cy="240" r="160" fill="url(#st-glow-cyan)"/>
<circle cx="600" cy="220" r="160" fill="url(#st-glow-crimson)"/>
<rect x="0.5" y="0.5" width="859" height="419" rx="15.5" stroke="url(#st-border)" stroke-width="1.2"/>

<!-- Header -->
<g transform="translate(45, 36)">
  <text x="0" y="0" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">03 / MY ENGINE ROOM</text>
  <text x="0" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">TOOLS CHANGE. CURIOSITY DOESN'T.</text>
  <text x="0" y="46" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">LANGUAGES / SYSTEMS / INTELLIGENCE</text>
</g>

<!-- LEFT: Planetary Atom Orbits (Center at x=215, y=240) -->
<g transform="translate(215, 240)">
  <ellipse class="orbit-track" cx="0" cy="0" rx="150" ry="65" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.5" transform="rotate(-25)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#ff0055" stroke-width="1.4" stroke-opacity="0.45" transform="rotate(25)"/>
  <ellipse class="orbit-track" cx="0" cy="0" rx="110" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6" transform="rotate(-65)"/>

  <!-- Nucleus Hexagon -->
  <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#050a16" stroke="#00f0ff" stroke-width="2"/>
  <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0d1f3d"/>
  <text x="0" y="5" text-anchor="middle" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1">MB</text>

  <!-- Nodes -->
  <g transform="translate(-120, -32)">
    <circle cx="0" cy="0" r="14" fill="#050a16" stroke="#00f0ff" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">Py</text>
  </g>
  <g transform="translate(115, 28)">
    <circle cx="0" cy="0" r="14" fill="#050a16" stroke="#00ADD8" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" fill="#00ADD8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">Go</text>
  </g>
  <g transform="translate(-55, 60)">
    <circle cx="0" cy="0" r="14" fill="#050a16" stroke="#61DAFB" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" fill="#61DAFB" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">Re</text>
  </g>
  <g transform="translate(65, -55)">
    <circle cx="0" cy="0" r="14" fill="#050a16" stroke="#34d399" stroke-width="1.4"/>
    <text x="0" y="4" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="800">No</text>
  </g>

  <text x="0" y="145" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">CODE IS THE TOOL. IMPACT IS THE POINT.</text>
</g>

<!-- RIGHT: Categorized Tech Chips (Starts at x=445) -->
<g transform="translate(445, 110)">
  <!-- 01 / LANGUAGES -->
  <text x="0" y="12" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">01 / LANGUAGES</text>
  <g transform="translate(0, 22)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="12" y="20" font-size="12">🐍</text>
    <text x="34" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Python</text>

    <rect x="122" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="134" y="20" font-size="12">🐹</text>
    <text x="156" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Golang</text>

    <rect x="244" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="256" y="20" font-size="12">📘</text>
    <text x="278" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">TypeScript</text>
  </g>

  <!-- 02 / FRONTEND & RUNTIME -->
  <text x="0" y="80" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">02 / FRONTEND &amp; RUNTIME</text>
  <g transform="translate(0, 90)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="12" y="20" font-size="12">⚛️</text>
    <text x="34" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">React 18</text>

    <rect x="122" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="134" y="20" font-size="12">▲</text>
    <text x="156" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Next.js</text>

    <rect x="244" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="256" y="20" font-size="12">🔥</text>
    <text x="278" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">SvelteKit</text>
  </g>

  <!-- 03 / BACKEND, CLOUD & AI -->
  <text x="0" y="148" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">03 / BACKEND, CLOUD &amp; AI</text>
  <g transform="translate(0, 158)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="12" y="20" font-size="12">🟢</text>
    <text x="34" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Node / Gin</text>

    <rect x="122" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="134" y="20" font-size="12">👁️</text>
    <text x="156" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">OpenCV</text>

    <rect x="244" y="0" width="112" height="32" rx="6" fill="#081022" stroke="#1e293b"/>
    <text x="256" y="20" font-size="12">⚡</text>
    <text x="278" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Supabase</text>
  </g>

  <text x="0" y="230" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">BUILD / MENTOR / CREATE / REPEAT</text>
</g>
</svg>