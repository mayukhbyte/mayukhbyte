<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" fill="none">
<defs>
  <linearGradient id="pt-bg" x1="0" y1="0" x2="860" y2="230" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#02040a"/>
    <stop offset="50%" stop-color="#060d1f"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>
  <linearGradient id="pt-border" x1="0" y1="0" x2="860" y2="230" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#247bff" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#ff0055" stop-opacity="0.6"/>
  </linearGradient>
</defs>

<rect width="860" height="230" rx="14" fill="url(#pt-bg)"/>
<rect x="0.5" y="0.5" width="859" height="229" rx="13.5" stroke="url(#pt-border)" stroke-width="1.2"/>

<!-- Table Header Row -->
<rect x="20" y="16" width="820" height="38" rx="6" fill="#071024" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5"/>
<text x="40" y="40" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1">PROJECT</text>
<text x="210" y="40" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1">WHAT IT DOES</text>
<text x="700" y="40" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1">FOCUS</text>

<!-- Row 1: ai-educator -->
<g transform="translate(20, 60)">
  <rect width="820" height="46" rx="6" fill="#050a16" stroke="#1e293b"/>
