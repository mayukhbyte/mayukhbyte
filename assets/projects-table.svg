  <text x="190" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">AI tutoring system with multi-level doubt solving &amp; adaptive quizzes</text>
  <rect x="670" y="11" width="130" height="24" rx="4" fill="#081730" stroke="#00f0ff" stroke-width="0.8"/>
