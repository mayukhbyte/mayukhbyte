  <rect width="820" height="46" rx="6" fill="#050a16" stroke="#1e293b"/>
  <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800">Paypaal-pro</text>
  <text x="190" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">Autonomous agent financial operations engine with AI dispute synthesis</text>
