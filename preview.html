  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #02040a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 880px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header-banner {
      background: linear-gradient(135deg, #060e22, #081228);
      border: 1px solid rgba(0, 240, 255, 0.5);
      padding: 18px 24px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.12);
    }
    .header-banner h1 {
      font-size: 20px;
      font-weight: 800;
      color: #00f0ff;
      letter-spacing: 0.5px;
    }
    .header-banner p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: #64748b;
    }
    .tag {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 20px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .svg-wrapper {
      background: #02040a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 240, 255, 0.08);
    }
    img.card-asset {
      width: 100%;
      height: auto;
      display: block;
    }
    .connect-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 20px 0;
    }
    .badge-btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .badge-btn:hover { opacity: 0.85; }
    .btn-linkedin { background: #0A66C2; color: #ffffff; }
    .btn-github { background: #181717; color: #ffffff; border: 1px solid #334155; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 10px 0 30px;
    }
  </style>
